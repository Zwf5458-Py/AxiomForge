[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomforge"
version = "0.1.0"
description = "Mathematical Discovery & Complex Dynamics via Algebraic Priors and LLM Program Evolution"
authors = [{ name = "Zwf5458-Py" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "numpy>=1.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
