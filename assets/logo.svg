<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="coreGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <!-- 发光滤镜 -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景暗调光晕 -->
  <circle cx="60" cy="60" r="54" fill="url(#centerGlow)" />

  <!-- 外围超环流形导轨 (高维投影) -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#coreGrad1)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.4" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#coreGrad2)" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- 莫比乌斯 / 双双纽线公理轨道 1 -->
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="url(#coreGrad1)" stroke-width="3" transform="rotate(-30 60 60)" filter="url(#bloom)" opacity="0.9" />
  
  <!-- 莫比乌斯 / 双双纽线公理轨道 2 -->
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="url(#coreGrad2)" stroke-width="3" transform="rotate(30 60 60)" filter="url(#bloom)" opacity="0.9" />

  <!-- 莫比乌斯 / 第三维正交轨道 -->
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(90 60 60)" opacity="0.75" />

  <!-- 有限域 Cap Set 极值节点阵列 -->
  <g fill="#e0f2fe">
    <circle cx="60" cy="18" r="3" fill="#38bdf8" filter="url(#bloom)" />
    <circle cx="96" cy="39" r="3.5" fill="#818cf8" filter="url(#bloom)" />
    <circle cx="96" cy="81" r="3" fill="#c084fc" filter="url(#bloom)" />
    <circle cx="60" cy="102" r="3.5" fill="#38bdf8" filter="url(#bloom)" />
    <circle cx="24" cy="81" r="3" fill="#818cf8" filter="url(#bloom)" />
    <circle cx="24" cy="39" r="3.5" fill="#c084fc" filter="url(#bloom)" />
  </g>

  <!-- 中心公理正八面体晶核 -->
  <polygon points="60,38 78,60 60,82 42,60" fill="none" stroke="#f8fafc" stroke-width="2" filter="url(#bloom)" />
  <polygon points="60,38 60,82 50,60" fill="url(#coreGrad1)" opacity="0.7" />
  <polygon points="60,38 60,82 70,60" fill="url(#coreGrad2)" opacity="0.7" />

  <!-- 中心能量奇点 -->
  <circle cx="60" cy="60" r="4.5" fill="#ffffff" filter="url(#bloom)" />
</svg>
